<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6efe4">
<title>quiero tu vida</title>
<link rel="stylesheet" href="css/encuesta.css">
</head>
<body class="nivel-0">
  <main id="app"></main>
  <div id="tramado" aria-hidden="true"></div>

  <!-- Filtro de pixelado. El tamaño de bloque lo ajusta main.js según el nivel. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="pixelar" x="0" y="0" width="100%" height="100%">
      <feFlood id="pix-flood" x="1" y="1" width="1" height="1"/>
      <feComposite id="pix-tile" width="2" height="2"/>
      <feTile result="rejilla"/>
      <feComposite in="SourceGraphic" in2="rejilla" operator="in"/>
      <feMorphology id="pix-dilate" operator="dilate" radius="1"/>
    </filter>
  </svg>

  <script type="module" src="js/main.js"></script>
</body>
</html>
