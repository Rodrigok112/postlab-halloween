<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotogramas del vídeo</title>
<style>
  @font-face { font-family: "VT323"; src: url("fonts/VT323-latin.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Rubik Wet Paint"; src: url("fonts/RubikWetPaint-latin.woff2") format("woff2"); font-display: block; }
  html, body { margin: 0; background: #111; color: #e9e2c8; font-family: "VT323", ui-monospace, monospace; }
  /* El motor mide este contenedor: 1080 × 1080 (360 × 360 internos). Se ve reducido. */
  #escena { width: 1080px; height: 1080px; transform: scale(.5); transform-origin: top left; }
  #escena canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #marco { position: relative; width: 540px; height: 540px; }
  /* Guía: la bola de 152 px en (540, 540) y la zona del QR con margen (328 px), a escala 1/2. */
  #guia { position: absolute; inset: 0; pointer-events: none; display: none; }
  #guia.on { display: block; }
  #guia .bola { position: absolute; left: 232px; top: 232px; width: 76px; height: 76px; border-radius: 50%; border: 1px solid #0f0; }
  #guia .qr { position: absolute; left: 188px; top: 188px; width: 164px; height: 164px; border: 1px dashed #0f0; }
  #panel { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; }
  button { font: inherit; font-size: 20px; padding: 4px 10px; color: #e9e2c8; background: #1d1a14; border: 2px solid #6b6248; cursor: pointer; }
  button.on { border-color: #e0141c; color: #fff; }
  #estado { font-size: 20px; min-height: 1.4em; }
</style>
</head>
<body>
<div id="marco"><div id="escena"></div><div id="guia"><div class="qr"></div><div class="bola"></div></div></div>
<div id="panel"></div>
<div id="estado"></div>
<script type="module" src="js/video.js"></script>
</body>
</html>
