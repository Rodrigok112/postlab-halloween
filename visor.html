<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de monstruos</title>
<style>
  @font-face { font-family: "VT323"; src: url("fonts/VT323-latin.woff2") format("woff2"); font-display: swap; }
  html, body { margin: 0; height: 100%; background: #000; color: #e9e2c8; font-family: "VT323", ui-monospace, monospace; }
  #escena { position: fixed; inset: 0; }
  #escena canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px 12px;
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    background: linear-gradient(transparent, rgba(0, 0, 0, .85) 30%);
  }
  #panel .fila { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; }
  button {
    font: inherit; font-size: 20px; padding: 4px 10px; color: #e9e2c8; background: rgba(20, 18, 14, .8);
    border: 2px solid #6b6248; border-radius: 0; cursor: pointer;
  }
  button.on { border-color: #e0141c; color: #fff; }
  #titulo { position: fixed; top: 10px; left: 0; right: 0; text-align: center; font-size: 26px; text-shadow: 2px 2px 0 #000; }
</style>
</head>
<body>
<div id="escena"></div>
<div id="titulo">el ente · reposo</div>
<div id="panel">
  <div class="fila" id="poses"></div>
  <div class="fila">
    <button id="entrada">▶ entrada (30 poses)</button>
    <button id="giro" class="on">360°</button>
    <button id="cara">cara</button>
    <button id="glitch">glitch</button>
    <button id="brazos">brazos de pared</button>
  </div>
</div>
<script type="module" src="js/visor.js"></script>
</body>
</html>
